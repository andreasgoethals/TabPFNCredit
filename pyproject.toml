# ============================================================================
# TabPFNCredit -- pyproject.toml
# ----------------------------------------------------------------------------
# Single source of truth for the runtime + optional dependencies. This is
# the *only* file you need -- there is no requirements.txt.
#
# Recommended installs:
#   * `pip install -e .`             core only
#   * `pip install -e ".[dev]"`      + pytest / ruff / black / isort /
#                                    pre-commit / nbstripout / mypy
#   * `pip install -e ".[local]"`    + CPU PyTorch + faiss-cpu + portalocker
#                                    (best for Windows / macOS workstation)
#   * `pip install -e ".[vsc]"`      + cu121 GPU PyTorch + portalocker + annoy
#                                    (KU Leuven wICE H100; cu118 for legacy P100
#                                    via --index-url override)
#   * `pip install -e ".[all]"`      everything above
# ============================================================================

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tabpfncredit"
version = "0.2.0"
description = "Benchmarking tabular foundation models for credit risk prediction."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE.txt" }
authors = [
    { name = "Andreas Goethals" },
]
keywords = [
    "tabular-learning",
    "credit-risk",
    "benchmark",
    "tabpfn",
    "talent",
    "foundation-models",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# ----------------------------------------------------------------------------
# Core runtime dependencies (always installed)
# ----------------------------------------------------------------------------
dependencies = [
    # ---- Core scientific stack ----
    "numpy>=1.26,<2.3",
    "pandas>=2.2,<3",
    "scipy>=1.13,<2",
    "scikit-learn>=1.4,<2",
    "pyarrow>=14,<18",

    # ---- TALENT framework deps ----
    "delu>=0.0.23,<0.1",
    "einops>=0.8,<1",
    "qhoptim>=1.1,<2",
    "category_encoders>=2.6,<3",
    "dill>=0.3.7,<0.4",
    "msgpack>=1.0.5,<2",
    "msgpack-numpy>=0.4.8,<0.5",
    "torchmetrics>=1.2,<2",
    "pytorch-lightning>=2.1,<2.6",
    "einx>=0.1.3",
    "safetensors>=0.4.2",

    # ---- Gradient boosting ----
    "xgboost>=2.1,<3",
    "lightgbm>=4.6,<5",
    "catboost>=1.2.8,<2",

    # ---- Tabular foundation models (TALENT delegates) ----
    "tabpfn>=8.0.0,<9",
    "tabicl>=2.0.0,<3",
    "tabdpt>=1.0,<2",

    # ---- HPO ----
    "optuna>=3.6,<4",

    # ---- Folds cache + parallelism ----
    "joblib>=1.3,<2",

    # ---- Config, CLI & utilities ----
    "packaging>=23,<25",
    "PyYAML>=6.0.1,<7",
    "tqdm>=4.66,<5",
    "Requests>=2.31,<3",
    "typing_extensions>=4.8,<5",
    "huggingface-hub>=0.21,<1",
    "typer>=0.12,<0.13",
    "rich>=13,<15",

    # ---- Credit-risk metrics ----
    "hmeasure>=0.1.6,<1",
    "imbalanced-learn>=0.11,<1",
    "statsmodels>=0.14,<1",

    # ---- Visualisation ----
    "matplotlib>=3.9,<4",
    "seaborn>=0.13,<1",
    "plotly>=5.22,<6",

    # ---- Aggregation ----
    "polars>=1.0,<2",

    # ---- Notebooks ----
    "notebook>=7.0,<8",

    # ---- TALENT (pin a commit SHA before archiving a release) ----
    "TALENT @ git+https://github.com/LAMDA-Tabular/TALENT@main",
]

# ----------------------------------------------------------------------------
# Optional dependencies
# ----------------------------------------------------------------------------
# Install via:
#     pip install -e ".[dev]"     # tests + lint + format
#     pip install -e ".[vsc]"     # VSC supercomputer (cu121 torch + portalocker)
#     pip install -e ".[local]"   # CPU PyTorch + faiss-cpu for laptop dev
#     pip install -e ".[all]"     # everything
[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-xdist>=3,<4",
    "ruff>=0.5,<1",
    "black>=24,<26",
    "isort>=5,<7",
    "pre-commit>=3.7,<4",
    "nbstripout>=0.7,<1",
    "mypy>=1.10,<2",
]
local = [
    # CPU PyTorch -- enough for local debugging on a workstation without
    # CUDA. The upper bound matches TALENT's own pin (torch==2.8).
    # If you have a GPU locally, use the [vsc] extra instead.
    "torch>=2.1,<3",
    "torchvision>=0.16,<1",
    "faiss-cpu>=1.13,<2",
    "portalocker>=2.8,<3",
]
vsc = [
    # GPU PyTorch -- targets wICE H100 (CUDA 12.1) by default. To run on
    # the legacy Genius P100 nodes (CUDA 11.8), override the wheel index:
    #   pip install -e ".[vsc]" --index-url https://download.pytorch.org/whl/cu118
    # Upper bound matches TALENT's own pin (torch==2.8).
    "torch>=2.4,<3",
    "torchvision>=0.19,<1",
    "torchaudio>=2.4,<3",
    # `faiss-gpu` is provided as a VSC module; never install via pip on VSC.
    # Annoy is the lightweight alternative for the TabR retrieval index.
    "annoy>=1.17,<2",
    # Portable file-lock (works under fcntl AND Windows -- kept for parity).
    "portalocker>=2.8,<3",
]
all = [
    "tabpfncredit[dev]",
    "tabpfncredit[local]",
    "tabpfncredit[vsc]",
]

[project.urls]
Homepage = "https://github.com/andreasgoethals/tabpfncredit"
Issues = "https://github.com/andreasgoethals/tabpfncredit/issues"

[project.scripts]
tabpfncredit = "src.cli:app"

# ----------------------------------------------------------------------------
# Package discovery
# ----------------------------------------------------------------------------
[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*"]
exclude = ["tests*", "venv*", "results*", "data*", "notebooks*"]

# ----------------------------------------------------------------------------
# Linters / formatters
# ----------------------------------------------------------------------------

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
extend-exclude = """
/(
    notebooks
  | venv
  | \\.cache
)/
"""

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["venv", "notebooks", "results", ".cache"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",  # line length handled by black
    "B008",  # allow default arg = function call (common for Optional[Path])
]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["src", "TALENT"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "smoke: minimal end-to-end run on synthetic data",
    "slow: tests that take more than ~30s",
    "gpu: tests that require a CUDA device",
]
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
no_implicit_optional = true
strict_equality = true
files = [
    "src/methods/method_config.py",
    "src/methods/method_runner.py",
    "src/methods/method_metrics.py",
    "src/methods/cost_metrics.py",
    "src/utils/result_io.py",
    "src/utils/logging_setup.py",
    "src/cli.py",
]
