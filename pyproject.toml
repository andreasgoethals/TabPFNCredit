# ============================================================================
# TabPFNCredit -- pyproject.toml
# ----------------------------------------------------------------------------
# Two install profiles -- pick ONE:
#
#   pip install -e ".[local]"   # CPU PyTorch + faiss-cpu + dev tools
#   pip install -e ".[hpc]"     # CUDA 12.1 PyTorch + annoy + dev tools
#
# Python 3.10 - 3.12 supported, 3.12 recommended.
#
# Why so many EXACT pins?
# -----------------------
# TALENT (our core dep, pulled from a git URL) pins a bunch of scientific
# packages to specific versions in its own pyproject.toml -- numpy 1.26.4,
# scipy 1.13.0, scikit-learn 1.4.2, torch 2.8.0, einops 0.8.0, etc.
#
# If our pyproject specifies even a SLIGHTLY different range for any of
# these, pip cannot satisfy both constraints and starts backtracking
# through every transitively-related package looking for a solution. It
# never finds one (because TALENT's pins are leaf constraints) so the
# install grinds for 30+ minutes before erroring out.
#
# The fix: mirror TALENT's pins exactly here, so pip sees one consistent
# constraint set and resolves in seconds. Bumping TALENT means updating
# both their pins and ours together.
# ============================================================================

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tabpfncredit"
version = "0.3.0"
description = "Benchmarking tabular foundation models for credit risk prediction."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE.txt" }
authors = [
    { name = "Andreas Goethals" },
]
keywords = [
    "tabular-learning",
    "credit-risk",
    "benchmark",
    "tabpfn",
    "talent",
    "foundation-models",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# ----------------------------------------------------------------------------
# Core runtime dependencies (always installed)
# ----------------------------------------------------------------------------
# EXACT pins below mirror TALENT's requirements.txt verbatim -- see the
# resolver comment at the top of the file. Bump TALENT then bump these.
dependencies = [
    # ---- Core scientific stack (TALENT-pinned) ----
    "numpy==1.26.4",
    "pandas==2.2.2",
    "scipy==1.13.0",
    "scikit-learn==1.4.2",
    "pyarrow>=14,<22",       # not TALENT-pinned; loose range is fine

    # ---- TALENT framework deps (TALENT-pinned) ----
    "delu==0.0.23",
    "einops==0.8.0",
    "qhoptim==1.1.0",
    "category_encoders==2.6.3",
    "tqdm==4.66.4",
    "Requests==2.31.0",
    "optuna==3.6.1",

    # ---- TALENT framework deps (not TALENT-pinned) ----
    "dill>=0.3.7,<0.4",
    "msgpack>=1.0.5,<2",
    "msgpack-numpy>=0.4.8,<0.5",
    "torchmetrics>=1.2,<2",
    "pytorch-lightning>=2.1,<2.6",
    "einx>=0.1.3",
    "safetensors>=0.5.3,<1",  # tabdpt 1.1.14 lower bound

    # ---- Gradient boosting (TALENT pins these in requirements.txt only;
    #      its pyproject leaves them open, so we use a wider range) ----
    "xgboost>=2.0,<3",
    "lightgbm>=4.3,<5",
    "catboost>=1.2.3,<2",

    # ---- Tabular foundation models -- EXACT pins so pip never backtracks ----
    "tabpfn==8.0.5",
    "tabicl==2.1.1",
    "tabdpt==1.1.14",
    # tabdpt transitively pulls omegaconf; pin >=2.3 here so pip skips
    # the antlr4 4.8 source-build fallback that lives in 2.1.x.
    "omegaconf>=2.3,<3",

    # ---- HuggingFace hub (tabdpt requires >=0.33.2) ----
    "huggingface-hub>=0.33.2,<1",

    # ---- Folds cache + parallelism ----
    "joblib>=1.3,<2",

    # ---- Config, CLI & utilities ----
    "packaging>=23,<25",
    "PyYAML>=6.0.1,<7",
    "typing_extensions>=4.8,<5",
    "typer>=0.12,<0.13",
    "rich>=13,<15",

    # ---- Credit-risk metrics ----
    "hmeasure>=0.1.6,<1",
    "imbalanced-learn>=0.11,<1",
    "statsmodels>=0.14,<1",

    # ---- Visualisation ----
    "matplotlib>=3.9,<4",
    "seaborn>=0.13,<1",
    "plotly>=5.22,<6",

    # ---- Aggregation ----
    "polars>=1.0,<2",

    # ---- Notebook kernel ----
    # We don't ship full `notebook` / JupyterLab (heavy + slow to
    # resolve). `ipykernel` is enough to register the venv as a Jupyter
    # kernel -- VSCode's Jupyter extension and `jupyter notebook` (if
    # you `pip install notebook` separately) both pick it up.
    "ipython>=8,<10",
    "ipykernel>=6,<7",

    # ---- TALENT (pin a commit SHA before archiving a release) ----
    "TALENT @ git+https://github.com/LAMDA-Tabular/TALENT@main",
]

# ----------------------------------------------------------------------------
# The two install profiles
# ----------------------------------------------------------------------------
[project.optional-dependencies]

# Local-workstation profile -- CPU PyTorch + dev tools. Self-contained.
local = [
    # torch / torchvision -- TALENT pins torch==2.8.0; torchvision 0.23
    # is its matching companion release.
    "torch==2.8.0",
    "torchvision==0.23.0",
    # tabdpt 1.1.14 needs faiss-cpu<1.13,>=1.11; 1.12.x is the latest match.
    "faiss-cpu>=1.11,<1.13",
    "portalocker>=2.8,<3",
    # Dev tools (loose ranges -- these don't conflict with foundation models).
    "pytest>=8,<9",
    "pytest-xdist>=3,<4",
    "ruff>=0.5,<1",
    "black>=24,<26",
    "isort>=5,<7",
    "pre-commit>=3.7,<4",
    "nbstripout>=0.7,<1",
    "mypy>=1.10,<2",
]

# HPC-cluster profile -- CUDA PyTorch + annoy + dev tools. Self-contained.
hpc = [
    # CUDA-12 PyTorch wheels by default. For CUDA-11.8 GPUs override:
    #     pip install -e ".[hpc]" --index-url https://download.pytorch.org/whl/cu118
    "torch==2.8.0",
    "torchvision==0.23.0",
    "torchaudio==2.8.0",
    # `faiss-gpu` is typically a cluster module on HPC; never pip-install.
    # Annoy is the lightweight alternative for the TabR retrieval index.
    "annoy>=1.17,<2",
    "portalocker>=2.8,<3",
    # Dev tools (same as local).
    "pytest>=8,<9",
    "pytest-xdist>=3,<4",
    "ruff>=0.5,<1",
    "black>=24,<26",
    "isort>=5,<7",
    "pre-commit>=3.7,<4",
    "nbstripout>=0.7,<1",
    "mypy>=1.10,<2",
]

[project.urls]
Homepage = "https://github.com/andreasgoethals/tabpfncredit"
Issues = "https://github.com/andreasgoethals/tabpfncredit/issues"

[project.scripts]
tabpfncredit = "src.cli:app"

# ----------------------------------------------------------------------------
# Package discovery (hatchling)
# ----------------------------------------------------------------------------
# Ship the ``src/`` directory verbatim in the wheel so ``import src.X``
# works after install. The ``scripts/`` tree is NOT packaged -- the CLI
# resolves it via ``Path(__file__).resolve().parents[2]`` (the repo root)
# which is correct for editable installs.
[tool.hatch.build.targets.wheel]
packages = ["src"]

# Allow ``TALENT @ git+...`` direct-reference deps.
[tool.hatch.metadata]
allow-direct-references = true

# ----------------------------------------------------------------------------
# Linters / formatters
# ----------------------------------------------------------------------------

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
extend-exclude = """
/(
    notebooks
  | venv
  | tabpfncreditvenv
  | \\.cache
)/
"""

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["venv", "tabpfncreditvenv", "notebooks", "results", ".cache"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",  # line length handled by black
    "B008",  # allow default arg = function call (common for Optional[Path])
]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["src", "TALENT"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "smoke: minimal end-to-end run on synthetic data",
    "slow: tests that take more than ~30s",
    "gpu: tests that require a CUDA device",
]
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
no_implicit_optional = true
strict_equality = true
files = [
    "src/methods/method_config.py",
    "src/methods/method_runner.py",
    "src/methods/method_metrics.py",
    "src/methods/cost_metrics.py",
    "src/utils/result_io.py",
    "src/utils/logging_setup.py",
    "src/cli.py",
]
