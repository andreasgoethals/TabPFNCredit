# ============================================================================
# TabPFNCredit -- pyproject.toml
# ----------------------------------------------------------------------------
# Two install profiles -- pick ONE:
#
#   pip install -e ".[local]"   # CPU PyTorch + faiss-cpu + dev tools
#   pip install -e ".[hpc]"     # CUDA 12.1 PyTorch + annoy + dev tools
#
# Python 3.10 - 3.12 supported, 3.12 recommended. 3.13 / 3.14 are blocked
# (many scientific deps still lack wheels for them).
#
# Resolution time
# ---------------
# Foundation-model packages (tabpfn / tabicl / tabdpt) release weekly with
# overlapping transitive deps -- if we leave their ranges open pip can
# spend 30+ minutes backtracking. We therefore pin them to exact known-
# good versions below. To bump one, change just that line + re-resolve.
# ============================================================================

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tabpfncredit"
version = "0.3.0"
description = "Benchmarking tabular foundation models for credit risk prediction."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE.txt" }
authors = [
    { name = "Andreas Goethals" },
]
keywords = [
    "tabular-learning",
    "credit-risk",
    "benchmark",
    "tabpfn",
    "talent",
    "foundation-models",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# ----------------------------------------------------------------------------
# Core runtime dependencies (always installed)
# ----------------------------------------------------------------------------
# Most pins are ranges; the foundation-model packages are EXACT pins on
# purpose -- see the resolution-time comment at the top of the file.
dependencies = [
    # ---- Core scientific stack (avoid 1.x numpy / sklearn 1.4 on Py3.12) ----
    "numpy>=2.0,<2.3",
    "pandas>=2.2,<3",
    "scipy>=1.13,<2",
    "scikit-learn>=1.5,<2",
    "pyarrow>=14,<22",

    # ---- TALENT framework deps ----
    "delu>=0.0.23,<0.1",
    "einops>=0.8,<1",
    "qhoptim>=1.1,<2",
    "category_encoders>=2.6,<3",
    "dill>=0.3.7,<0.4",
    "msgpack>=1.0.5,<2",
    "msgpack-numpy>=0.4.8,<0.5",
    "torchmetrics>=1.2,<2",
    "pytorch-lightning>=2.1,<2.6",
    "einx>=0.1.3",
    "safetensors>=0.4.2",

    # ---- Gradient boosting ----
    "xgboost>=2.1,<3",
    "lightgbm>=4.6,<5",
    "catboost>=1.2.8,<2",

    # ---- Tabular foundation models -- EXACT pins so pip never backtracks ----
    "tabpfn==8.0.5",
    "tabicl==2.1.1",
    "tabdpt==1.1.14",
    # tabdpt 1.1.14 transitively requires `omegaconf>=2.1`, `faiss-cpu<1.13`.
    # Pinning omegaconf>=2.3 here avoids the antlr4 source-build fallback
    # that pip would otherwise hit (antlr4-python3-runtime 4.8 has no wheel
    # and takes minutes to compile from source).
    "omegaconf>=2.3,<3",

    # ---- HPO ----
    "optuna>=3.6,<4",

    # ---- Folds cache + parallelism ----
    "joblib>=1.3,<2",

    # ---- Config, CLI & utilities ----
    "packaging>=23,<25",
    "PyYAML>=6.0.1,<7",
    "tqdm>=4.66,<5",
    "Requests>=2.31,<3",
    "typing_extensions>=4.8,<5",
    "huggingface-hub>=0.21,<1",
    "typer>=0.12,<0.13",
    "rich>=13,<15",

    # ---- Credit-risk metrics ----
    "hmeasure>=0.1.6,<1",
    "imbalanced-learn>=0.11,<1",
    "statsmodels>=0.14,<1",

    # ---- Visualisation ----
    "matplotlib>=3.9,<4",
    "seaborn>=0.13,<1",
    "plotly>=5.22,<6",

    # ---- Aggregation ----
    "polars>=1.0,<2",

    # ---- Notebook kernel ----
    # NOTE: we don't ship the full `notebook` / JupyterLab packages -- those
    # pull in ~30 transitive deps (jupyter-server, tornado, ...) and slow
    # resolution to a crawl. `ipykernel` is enough to register the venv
    # as a Jupyter kernel; open the notebooks via VSCode's Jupyter
    # extension, or `pip install notebook` separately if you need
    # `jupyter notebook` on the CLI.
    "ipython>=8,<10",
    "ipykernel>=6,<7",

    # ---- TALENT (pin a commit SHA before archiving a release) ----
    "TALENT @ git+https://github.com/LAMDA-Tabular/TALENT@main",
]

# ----------------------------------------------------------------------------
# The two install profiles
# ----------------------------------------------------------------------------
[project.optional-dependencies]

# Local-workstation profile -- CPU PyTorch + dev tools. Self-contained.
local = [
    # Torch 2.4 / 2.5 ship Py3.12 wheels and are tested with TALENT.
    "torch>=2.4,<2.6",
    "torchvision>=0.19,<0.21",
    "faiss-cpu>=1.11,<1.13",
    "portalocker>=2.8,<3",
    # Dev tools
    "pytest>=8,<9",
    "pytest-xdist>=3,<4",
    "ruff>=0.5,<1",
    "black>=24,<26",
    "isort>=5,<7",
    "pre-commit>=3.7,<4",
    "nbstripout>=0.7,<1",
    "mypy>=1.10,<2",
]

# HPC-cluster profile -- CUDA PyTorch + annoy + dev tools. Self-contained.
hpc = [
    # CUDA 12.1 PyTorch wheels by default. For CUDA 11.8 GPUs override
    # the wheel index:
    #     pip install -e ".[hpc]" --index-url https://download.pytorch.org/whl/cu118
    "torch>=2.4,<2.6",
    "torchvision>=0.19,<0.21",
    "torchaudio>=2.4,<2.6",
    # `faiss-gpu` is typically a cluster module on HPC; never pip-install.
    # Annoy is the lightweight alternative for the TabR retrieval index.
    "annoy>=1.17,<2",
    "portalocker>=2.8,<3",
    # Dev tools (same as local).
    "pytest>=8,<9",
    "pytest-xdist>=3,<4",
    "ruff>=0.5,<1",
    "black>=24,<26",
    "isort>=5,<7",
    "pre-commit>=3.7,<4",
    "nbstripout>=0.7,<1",
    "mypy>=1.10,<2",
]

[project.urls]
Homepage = "https://github.com/andreasgoethals/tabpfncredit"
Issues = "https://github.com/andreasgoethals/tabpfncredit/issues"

[project.scripts]
tabpfncredit = "src.cli:app"

# ----------------------------------------------------------------------------
# Package discovery (hatchling)
# ----------------------------------------------------------------------------
# Ship the ``src/`` directory verbatim in the wheel so ``import src.X``
# works after install. The ``scripts/`` tree is intentionally NOT
# packaged -- the CLI resolves it relative to the source repo via
# ``Path(__file__).resolve().parents[2]``, which is the right behaviour
# for the only install mode we support (editable ``pip install -e .``).
[tool.hatch.build.targets.wheel]
packages = ["src"]

# Allow ``TALENT @ git+...`` direct-reference deps.
[tool.hatch.metadata]
allow-direct-references = true

# ----------------------------------------------------------------------------
# Linters / formatters
# ----------------------------------------------------------------------------

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
extend-exclude = """
/(
    notebooks
  | venv
  | \\.cache
)/
"""

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["venv", "notebooks", "results", ".cache"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",  # line length handled by black
    "B008",  # allow default arg = function call (common for Optional[Path])
]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["src", "TALENT"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "smoke: minimal end-to-end run on synthetic data",
    "slow: tests that take more than ~30s",
    "gpu: tests that require a CUDA device",
]
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
no_implicit_optional = true
strict_equality = true
files = [
    "src/methods/method_config.py",
    "src/methods/method_runner.py",
    "src/methods/method_metrics.py",
    "src/methods/cost_metrics.py",
    "src/utils/result_io.py",
    "src/utils/logging_setup.py",
    "src/cli.py",
]
