# ============================================================================
# TabPFNCredit -- pyproject.toml
# ----------------------------------------------------------------------------
# ONE-STEP install -- pick ONE profile:
#
#   pip install -e ".[local]"   # CPU PyTorch + faiss-cpu + dev tools
#   pip install -e ".[hpc]"     # CUDA PyTorch + annoy + dev tools
#
# Python 3.10 - 3.12 supported, 3.12 recommended.
#
# TALENT is a normal dependency now
# ---------------------------------
# TALENT (our core framework) is pulled in directly from our fork below:
#
#     TALENT @ git+https://github.com/andreasgoethals/TALENT@main
#
# Historically TALENT pinned all its deps to EXACT versions (e.g.
# requests==2.31.0) that clashed with the foundation models (tabpfn needs
# requests>=2.32.5), so we had to install it with ``--no-deps`` in a second
# step. The fork now uses LOWER BOUNDS (>=) instead, so those conflicts are
# gone and pip can resolve everything in a single pass. No more two-step
# install, no more install.{sh,ps1} helpers.
#
# Version pins
# ------------
# We use LOWER BOUNDS (>=) matching TALENT's tested floors rather than exact
# pins. This installs cleanly into existing environments (no forced
# downgrades) while still guaranteeing a known-good minimum. ``requests`` is
# floored at tabpfn's requirement (>=2.32.5), which now coexists happily with
# TALENT's requests>=2.31.0. The one HARD cap kept is click<8.2 (see below).
# ============================================================================

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tabpfncredit"
version = "0.3.0"
description = "Benchmarking tabular foundation models for credit risk prediction."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE.txt" }
authors = [
    { name = "Andreas Goethals" },
]
keywords = [
    "tabular-learning",
    "credit-risk",
    "benchmark",
    "tabpfn",
    "talent",
    "foundation-models",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# ----------------------------------------------------------------------------
# Core runtime dependencies (always installed)
# ----------------------------------------------------------------------------
# Lower bounds (>=) mirror TALENT's tested floors (its requirements.txt /
# pyproject use the same >= versions). Bump TALENT then bump these.
dependencies = [
    # ---- TALENT framework (our fork; direct git reference) ----
    # Pulled in directly so `pip install -e ".[local|hpc]"` is a single step.
    # Pin to a tag/commit here if you need a frozen TALENT for a paper run.
    "TALENT @ git+https://github.com/andreasgoethals/TALENT@main",

    # ---- Core scientific stack (TALENT floors) ----
    "numpy>=1.26.4",
    "pandas>=2.2.2",
    "scipy>=1.13.0",
    "scikit-learn>=1.4.2",
    "pyarrow>=14,<22",

    # ---- TALENT framework deps ----
    "delu>=0.0.23",
    "einops>=0.8.0",
    "qhoptim>=1.1.0",
    "category_encoders>=2.6.3",
    "tqdm>=4.66.4",
    # requests: floored at tabpfn's requirement (>=2.32.5); compatible with
    # TALENT's requests>=2.31.0 now that TALENT uses lower bounds too.
    "requests>=2.32.5,<3",
    "optuna>=3.6.1",

    # ---- TALENT framework deps (not TALENT-pinned) ----
    "dill>=0.3.7,<0.4",
    "msgpack>=1.0.5,<2",
    "msgpack-numpy>=0.4.8,<0.5",
    "torchmetrics>=1.2,<2",
    "pytorch-lightning>=2.1,<2.6",
    "einx>=0.1.3",
    "safetensors>=0.5.3,<1",  # tabdpt 1.1.14 lower bound

    # ---- Gradient boosting (TALENT pins these in requirements.txt only;
    #      its pyproject leaves them open, so we use a wider range) ----
    "xgboost>=2.0,<3",
    "lightgbm>=4.3,<5",
    "catboost>=1.2.3,<2",

    # ---- Tabular foundation models (lower bounds = tested floors) ----
    "tabpfn>=8.0.5",
    "tabicl>=2.1.1",
    "tabdpt>=1.1.14",
    # tabdpt transitively pulls omegaconf; pin >=2.3 here so pip skips
    # the antlr4 4.8 source-build fallback that lives in 2.1.x.
    "omegaconf>=2.3,<3",

    # ---- HuggingFace hub (tabdpt requires >=0.33.2) ----
    "huggingface-hub>=0.33.2,<1",

    # ---- Folds cache + parallelism ----
    "joblib>=1.3,<2",

    # ---- Config, CLI & utilities ----
    "packaging>=23,<25",
    "PyYAML>=6.0.1,<7",
    "typing_extensions>=4.8,<5",
    "typer>=0.12,<0.13",
    # Click 8.2 added strict validation that rejects the ``--flag/--no-flag``
    # secondary flags Typer 0.12.x emits for EVERY boolean option, raising
    # "Secondary flag is not valid for non-boolean flag" at import time.
    # Typer 0.12.5 is only compatible with Click < 8.2, so cap it here --
    # otherwise pip grabs the latest Click and the CLI won't even start.
    "click>=8.1,<8.2",
    "rich>=13,<15",

    # ---- Credit-risk metrics ----
    "hmeasure>=0.1.6,<1",
    "imbalanced-learn>=0.11,<1",
    "statsmodels>=0.14,<1",

    # ---- Visualisation ----
    "matplotlib>=3.9,<4",
    "seaborn>=0.13,<1",
    "plotly>=5.22,<6",

    # ---- Aggregation ----
    "polars>=1.0,<2",

    # ---- Notebook kernel + headless execution ----
    # We don't ship full `notebook` / JupyterLab (heavy + slow to
    # resolve). `ipykernel` registers the venv as a Jupyter kernel
    # (VSCode's Jupyter extension and `jupyter notebook` both pick it up).
    # `nbconvert` is what `python -m src.utils.run_notebooks` uses to clear,
    # restart-and-run every analysis notebook headlessly and collect their
    # printed output into results/All_Results.md.
    "ipython>=8,<10",
    "ipykernel>=6,<7",
    "nbconvert>=7,<8",
]

# ----------------------------------------------------------------------------
# The two install profiles
# ----------------------------------------------------------------------------
[project.optional-dependencies]

# Local-workstation profile -- CPU PyTorch + dev tools. Self-contained.
local = [
    # torch / torchvision -- TALENT floors torch>=2.8.0; torchvision 0.23
    # is its matching companion release.
    "torch>=2.8.0",
    "torchvision>=0.23.0",
    # tabdpt needs faiss-cpu>=1.11,<1.13; 1.12.x is the latest match.
    "faiss-cpu>=1.11,<1.13",
    # Dev tools (loose ranges -- these don't conflict with foundation models).
    "pytest>=8,<9",
    "pytest-xdist>=3,<4",
    "ruff>=0.5,<1",
    "black>=24,<26",
    "isort>=5,<7",
    "pre-commit>=3.7,<4",
    "nbstripout>=0.7,<1",
    "mypy>=1.10,<2",
]

# HPC-cluster profile -- CUDA PyTorch + annoy + dev tools. Self-contained.
hpc = [
    # CUDA-12 PyTorch wheels by default. For CUDA-11.8 GPUs override:
    #     pip install -e ".[hpc]" --index-url https://download.pytorch.org/whl/cu118
    "torch>=2.8.0",
    "torchvision>=0.23.0",
    "torchaudio>=2.8.0",
    # `faiss-gpu` is typically a cluster module on HPC; never pip-install.
    # Annoy is the lightweight alternative for the TabR retrieval index.
    "annoy>=1.17,<2",
    # Dev tools (same as local).
    "pytest>=8,<9",
    "pytest-xdist>=3,<4",
    "ruff>=0.5,<1",
    "black>=24,<26",
    "isort>=5,<7",
    "pre-commit>=3.7,<4",
    "nbstripout>=0.7,<1",
    "mypy>=1.10,<2",
]

# TabFM profile add-on -- Google Research's TabFM foundation model (2026).
# NOT part of the core dependencies on purpose:
#   * `tabfm` requires Python >= 3.11 (the core project still supports 3.10);
#   * the model is toggled OFF in every CONFIG_METHOD.yaml by default.
# To enable the method: install with the extra, stage its weights
# (`python -m src.utils.fetch_weights --only tabfm`), then flip `tabfm: true`
# in the experiment's CONFIG_METHOD.yaml.
#     pip install -e ".[local,tabfm]"     # or ".[hpc,tabfm]"
tabfm = [
    "tabfm[pytorch]>=1.0.0,<2",
    # tabfm 1.0.0 imports sklearn's `validate_data` (added in scikit-learn 1.6)
    # but forgets to declare the floor in its metadata -- pin it here so the
    # extra installs a working combination (core deps only require >=1.4.2).
    "scikit-learn>=1.6",
]

[project.urls]
Homepage = "https://github.com/andreasgoethals/tabpfncredit"
Issues = "https://github.com/andreasgoethals/tabpfncredit/issues"

[project.scripts]
tabpfncredit = "src.utils.cli:app"

# ----------------------------------------------------------------------------
# Package discovery (hatchling)
# ----------------------------------------------------------------------------
# Ship the ``src/`` directory verbatim in the wheel so ``import src.X``
# works after install. The ``scripts/`` tree is NOT packaged -- the CLI
# resolves it via ``Path(__file__).resolve().parents[2]`` (the repo root)
# which is correct for editable installs.
[tool.hatch.build.targets.wheel]
packages = ["src"]

# Allow ``TALENT @ git+...`` direct-reference deps.
[tool.hatch.metadata]
allow-direct-references = true

# ----------------------------------------------------------------------------
# Linters / formatters
# ----------------------------------------------------------------------------

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
extend-exclude = """
/(
    notebooks
  | venv
  | tabpfncreditvenv
  | \\.cache
)/
"""

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["venv", "tabpfncreditvenv", "notebooks", "results", ".cache"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",  # line length handled by black
    "B008",  # allow default arg = function call (common for Optional[Path])
]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["src", "TALENT"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "smoke: minimal end-to-end run on synthetic data",
    "slow: tests that take more than ~30s",
    "gpu: tests that require a CUDA device",
]
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
no_implicit_optional = true
strict_equality = true
files = [
    "src/methods/method_config.py",
    "src/methods/method_runner.py",
    "src/methods/method_metrics.py",
    "src/methods/cost_metrics.py",
    "src/utils/result_io.py",
    "src/utils/config_reader.py",
    "src/utils/cli.py",
]
