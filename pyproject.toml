# ============================================================================
# TabPFNCredit -- pyproject.toml
# ----------------------------------------------------------------------------
# Single source of truth for the runtime + optional dependencies. There are
# exactly two install profiles:
#
#   * `pip install -e ".[local]"`
#       Everything you need to run on a local machine:
#         - all runtime deps (TALENT, sklearn, polars, typer, ...)
#         - CPU PyTorch + faiss-cpu (no CUDA required)
#         - dev tools (pytest, ruff, black, isort, mypy, pre-commit, nbstripout)
#         - portalocker (Windows-friendly cross-process file lock)
#       Use this on a Windows / macOS / Linux workstation without a GPU,
#       or with a GPU but where you only intend to develop / smoke-test.
#
# That's it. There is no [dev] or [all] profile -- both `local` and `hpc`
# already include the dev tooling.
#
#   * `pip install -e ".[hpc]"`
#       Everything you need to run on a SLURM-based HPC cluster:
#         - all runtime deps
#         - CUDA 12.1 PyTorch wheels (wICE H100 / A100; for older CUDA
#           11.8 GPUs like Genius P100 add
#           `--index-url https://download.pytorch.org/whl/cu118`)
#         - annoy (replaces faiss-gpu, which on many clusters is
#           installed as a module and must NOT be pip-installed)
#         - dev tools (same as local) so we can run pytest on the cluster
#         - portalocker (kept for parity)
#
# Python version -- 3.10 to 3.12 supported, 3.12 recommended.
# Python 3.13/3.14 are blocked by `requires-python` because several
# scientific deps (numpy < 2.1, scikit-learn < 1.7, hmeasure, ...) do
# not ship wheels for them yet and the source builds fail.
# ============================================================================

# We use the hatchling build backend (PEP 660 editable installs) rather
# than setuptools. setuptools writes a ``<package>.egg-info/`` directory
# into the source tree on every ``pip install -e .`` and regenerates it
# again on every subsequent run; hatchling skips that entirely and keeps
# all install metadata in ``site-packages``. Net effect: no
# ``tabpfncredit.egg-info/`` clutter next to the code.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tabpfncredit"
version = "0.3.0"
description = "Benchmarking tabular foundation models for credit risk prediction."
readme = "README.md"
# Python 3.13+ lacks Cython-built wheels for several of our deps
# (numpy < 2.1, scikit-learn < 1.7, hmeasure, msgpack-numpy, ...). Pip
# then falls back to source builds that pull yanked numpy release
# candidates and fail with a confusing error. We cap to <3.13 so users
# get an immediate, readable "Python 3.13 / 3.14 not supported" message
# from pip instead. **Recommended: Python 3.12.**
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE.txt" }
authors = [
    { name = "Andreas Goethals" },
]
keywords = [
    "tabular-learning",
    "credit-risk",
    "benchmark",
    "tabpfn",
    "talent",
    "foundation-models",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# ----------------------------------------------------------------------------
# Core runtime dependencies (always installed)
# ----------------------------------------------------------------------------
dependencies = [
    # ---- Core scientific stack ----
    "numpy>=1.26,<2.3",
    "pandas>=2.2,<3",
    "scipy>=1.13,<2",
    "scikit-learn>=1.4,<2",
    "pyarrow>=14,<22",

    # ---- TALENT framework deps ----
    "delu>=0.0.23,<0.1",
    "einops>=0.8,<1",
    "qhoptim>=1.1,<2",
    "category_encoders>=2.6,<3",
    "dill>=0.3.7,<0.4",
    "msgpack>=1.0.5,<2",
    "msgpack-numpy>=0.4.8,<0.5",
    "torchmetrics>=1.2,<2",
    "pytorch-lightning>=2.1,<2.6",
    "einx>=0.1.3",
    "safetensors>=0.4.2",

    # ---- Gradient boosting ----
    "xgboost>=2.1,<3",
    "lightgbm>=4.6,<5",
    "catboost>=1.2.8,<2",

    # ---- Tabular foundation models (TALENT delegates) ----
    "tabpfn>=8.0.0,<9",
    "tabicl>=2.0.0,<3",
    "tabdpt>=1.0,<2",

    # ---- HPO ----
    "optuna>=3.6,<4",

    # ---- Folds cache + parallelism ----
    "joblib>=1.3,<2",

    # ---- Config, CLI & utilities ----
    "packaging>=23,<25",
    "PyYAML>=6.0.1,<7",
    "tqdm>=4.66,<5",
    "Requests>=2.31,<3",
    "typing_extensions>=4.8,<5",
    "huggingface-hub>=0.21,<1",
    "typer>=0.12,<0.13",
    "rich>=13,<15",

    # ---- Credit-risk metrics ----
    "hmeasure>=0.1.6,<1",
    "imbalanced-learn>=0.11,<1",
    "statsmodels>=0.14,<1",

    # ---- Visualisation ----
    "matplotlib>=3.9,<4",
    "seaborn>=0.13,<1",
    "plotly>=5.22,<6",

    # ---- Aggregation ----
    "polars>=1.0,<2",

    # ---- Notebooks ----
    "notebook>=7.0,<8",
    "ipython>=8,<10",
    # ipykernel is what `jupyter` actually runs inside each notebook;
    # without it `jupyter notebook` opens but the kernel never starts.
    "ipykernel>=6,<7",

    # ---- TALENT (pin a commit SHA before archiving a release) ----
    "TALENT @ git+https://github.com/LAMDA-Tabular/TALENT@main",
]

# ----------------------------------------------------------------------------
# The two install profiles
# ----------------------------------------------------------------------------
[project.optional-dependencies]

# Local-workstation profile -- CPU PyTorch + dev tools. Self-contained.
local = [
    # CPU PyTorch. If you have a CUDA GPU locally and want to use it, use
    # the [vsc] extras instead -- they ship the CUDA wheels.
    "torch>=2.1,<3",
    "torchvision>=0.16,<1",
    # tabdpt pins faiss-cpu<1.13 transitively; we therefore cap below
    # 1.13 to keep the resolver happy. The range still covers the
    # versions that TALENT's TabR retrieval indexer was tested on.
    "faiss-cpu>=1.11,<1.13",
    "portalocker>=2.8,<3",
    # Dev tools (tests + lint + format + pre-commit + notebook output strip)
    "pytest>=8,<9",
    "pytest-xdist>=3,<4",
    "ruff>=0.5,<1",
    "black>=24,<26",
    "isort>=5,<7",
    "pre-commit>=3.7,<4",
    "nbstripout>=0.7,<1",
    "mypy>=1.10,<2",
]

# HPC-cluster profile -- CUDA PyTorch + annoy + dev tools.
# Self-contained.
hpc = [
    # GPU PyTorch -- defaults to CUDA 12.1 wheels (e.g. KU Leuven wICE
    # H100 / A100). For older CUDA 11.8 GPUs (e.g. Genius P100) override
    # the wheel index:
    #     pip install -e ".[hpc]" --index-url https://download.pytorch.org/whl/cu118
    "torch>=2.4,<3",
    "torchvision>=0.19,<1",
    "torchaudio>=2.4,<3",
    # `faiss-gpu` is typically installed as a cluster module; do not
    # pip-install it. Annoy is the lightweight alternative for the
    # TabR retrieval index.
    "annoy>=1.17,<2",
    # Portable file-lock (works under fcntl AND Windows -- kept for parity).
    "portalocker>=2.8,<3",
    # Dev tools -- same set as [local], so pytest + lint work on the cluster.
    "pytest>=8,<9",
    "pytest-xdist>=3,<4",
    "ruff>=0.5,<1",
    "black>=24,<26",
    "isort>=5,<7",
    "pre-commit>=3.7,<4",
    "nbstripout>=0.7,<1",
    "mypy>=1.10,<2",
]

[project.urls]
Homepage = "https://github.com/andreasgoethals/tabpfncredit"
Issues = "https://github.com/andreasgoethals/tabpfncredit/issues"

[project.scripts]
tabpfncredit = "src.cli:app"

# ----------------------------------------------------------------------------
# Package discovery (hatchling)
# ----------------------------------------------------------------------------
# Ship the ``src/`` directory verbatim in the wheel so ``import src.X``
# works after install. The ``scripts/`` tree (YAML configs + generated
# SLURM scripts) is intentionally NOT packaged -- the CLI resolves it
# relative to the source repo via ``Path(__file__).resolve().parents[2]``,
# which is the right behaviour for the only install mode we support
# (editable via ``pip install -e ".[...]"``).
[tool.hatch.build.targets.wheel]
packages = ["src"]

# TALENT is installed via a ``git+`` URL (a PEP 440 "direct reference").
# Setuptools allowed direct references silently; hatchling refuses them
# by default for supply-chain reasons. We opt in here because TALENT is
# our own benchmark dependency and pulling it straight from GitHub is
# intentional. Pin a commit SHA in the ``TALENT @ git+...`` line of
# ``[project].dependencies`` before archiving a release.
[tool.hatch.metadata]
allow-direct-references = true

# ----------------------------------------------------------------------------
# Linters / formatters
# ----------------------------------------------------------------------------

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
extend-exclude = """
/(
    notebooks
  | venv
  | \\.cache
)/
"""

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["venv", "notebooks", "results", ".cache"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",  # line length handled by black
    "B008",  # allow default arg = function call (common for Optional[Path])
]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["src", "TALENT"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "smoke: minimal end-to-end run on synthetic data",
    "slow: tests that take more than ~30s",
    "gpu: tests that require a CUDA device",
]
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
no_implicit_optional = true
strict_equality = true
files = [
    "src/methods/method_config.py",
    "src/methods/method_runner.py",
    "src/methods/method_metrics.py",
    "src/methods/cost_metrics.py",
    "src/utils/result_io.py",
    "src/utils/logging_setup.py",
    "src/cli.py",
]
