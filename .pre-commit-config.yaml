# ============================================================
# pre-commit hooks for TabPFNCredit
# ============================================================
# Install once:
#     pip install -r requirements.txt   # pulls pre-commit
#     pre-commit install
# Then every `git commit` runs the hooks automatically.
#
# To run them manually over the whole repo:
#     pre-commit run --all-files
# ============================================================

repos:
  # ---- House-keeping ----
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=2048']
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ['--fix=lf']

  # ---- Linter + autofix ----
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.7
    hooks:
      - id: ruff
        args: ['--fix', '--exit-non-zero-on-fix']
      - id: ruff-format

  # ---- Import sorting ----
  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ['--profile=black']

  # ---- Black formatting (fallback for files ruff-format doesn't touch) ----
  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black
        language_version: python3
        args: ['--line-length=100']

  # ---- Notebook hygiene ----
  - repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks:
      - id: nbstripout
