# ============================================================
# CONFIG_METHOD.yaml
# ============================================================
# This configuration file controls which models are included in the experiments for both PD (classification) and LGD (regression) tasks. 
# - Set each method to true to include it in the benchmark. 
# - Set to false to exclude it. 
# This configuration file uses TALENT's canonical model names.
# ============================================================

methods:

  # ----------------------------------------------------------
  # Probability of Default (PD) – Classification Methods
  # ----------------------------------------------------------
  pd:
    # -----------------------------
    # Classical Machine Learning
    # -----------------------------
    catboost: true        # CatBoost
    knn: true             # K-Nearest Neighbors
    lightgbm: true        # LightGBM
    LogReg: true          # Logistic Regression
    NaiveBayes: true      # Naive Bayes
    RandomForest: true    # Random Forest
    svm: true             # Support Vector Machine
    xgboost: true         # Extreme Gradient Boosting
    NCM: true             # Nearest Class Mean
    dummy: true           # Dummy baseline classifier

    # -----------------------------
    # Deep / Neural / Transformer-based Methods
    # -----------------------------
    
    # 1. Foundation Models & Prior-Data Fitted Networks (PFNs)
    #    (Pre-trained on large datasets or priors to work out-of-the-box)
    tabpfn: true          # TabPFN v1 (classification)
    tabpfn_v2: true       # TabPFN v2 (classification)
    tabpfn_v2_5: true     # TabPFN v2.5 (PriorLabs Nov 2025; requires `tabpfn>=8.0.0`)
    tabpfn_v3: true       # TabPFN v3 (PriorLabs 2026; ~1M-row context)
    tabpfn_real: true     # Real-TabPFN
    tabicl: true          # TabICL v1
    tabicl_v2: true       # TabICL v2 (ICML 2026; supports classification + regression)
    tabdpt: true          # TabDPT (Layer 6 AI; ICL + retrieval)
    tabptm: false         # TabPTM
    mitra: true           # MITRA
    hyperfast: false       # HyperFast

    # 2. Transformer-based Architectures
    #    (Utilize self-attention mechanisms adapted for tabular data)
    ftt: true             # Feature Tokenizer Transformer
    saint: false          # SAINT (Self-Attention and Intersample Attention Transformer)
    tabtransformer: true  # TabTransformer
    autoint: true         # AutoInt
    excelformer: true     # ExcelFormer
    amformer: true        # AMFormer
    trompt: false         # TROMPT
    t2gformer: true       # T2G-Former
    ptarl: true           # PTARL (uses tabular representation learning)

    # 3. MLP-based & ResNet Variants
    #    (Modern adaptations of standard neural networks)
    mlp: true             # Multilayer Perceptron
    resnet: true          # ResNet
    snn: true             # Self-Normalizing Neural Networks
    realmlp: true         # RealMLP
    mlp_plr: true         # MLP-PLR
    danets: true          # DANets (Deep Abstract Networks)
    switchtab: true       # SwitchTab
    
    # 4. Hybrid / Tree-Inspired / Ensemble Neural Networks
    #    (Combine deep learning with decision tree or ensemble concepts)
    tabnet: true          # TabNet
    node: true            # Neural Oblivious Decision Ensembles
    grownet: true         # GrowNet
    dcn2: true            # Deep & Cross Network v2
    tabm: true            # TabM (Tabular Machines / Batch Ensembling)
    
    # 5. Specialized & Advanced Architectures
    #    (Novel mechanisms like capsules, prototypes, or regularization)
    tabcaps: true         # TabCaps
    tangos: true          # TANGOS (Regularization/Augmentation)
    modernNCA: true       # ModernNCA (Neighborhood Components Analysis)
    bishop: true          # BISHOP
    protogate: true       # ProtoGate
    tabautopnpnet: false  # TabAuto-PNPNet
    tabr: false           # TabR
    limix: false          # LiMiX 

  # ----------------------------------------------------------
  # Loss Given Default (LGD) – Regression Methods
  # ----------------------------------------------------------
  lgd:
    # -----------------------------
    # Classical Machine Learning
    # -----------------------------
    catboost: true         # CatBoost
    knn: true              # K-Nearest Neighbors
    lightgbm: true         # LightGBM
    LinearRegression: true # Linear Regression
    RandomForest: true     # Random Forest
    xgboost: true          # Extreme Gradient Boosting
    svm: true              # Support Vector Machine

    # -----------------------------
    # Deep / Neural / Transformer-based Methods
    # -----------------------------

    # 1. Foundation Models & PFNs
    tabpfn_v2: true        # TabPFN v2 (supports regression)
    tabpfn_v2_5: true      # TabPFN v2.5 (supports regression)
    tabpfn_v3: true        # TabPFN v3 (supports regression)
    tabicl_v2: true        # TabICL v2 (regression support added in ICML 2026)
    tabdpt: true           # TabDPT (supports regression)
    tabptm: false          # TabPTM
    mitra: true            # MITRA

    # 2. Transformer-based Architectures
    ftt: true             # Feature Tokenizer Transformer
    saint: false          # SAINT
    tabtransformer: true  # TabTransformer
    autoint: true         # AutoInt
    excelformer: true     # ExcelFormer
    amformer: true        # AMFormer
    trompt: false         # TROMPT
    t2gformer: true       # T2G-Former
    ptarl: true           # PTARL

    # 3. MLP-based & ResNet Variants
    mlp: true             # Multilayer Perceptron
    resnet: true          # ResNet
    snn: true             # Self-Normalizing Neural Networks
    realmlp: true         # RealMLP
    mlp_plr: true         # MLP-PLR
    danets: true          # DANets
    switchtab: true       # SwitchTab
    
    # 4. Hybrid / Tree-Inspired / Ensemble Neural Networks
    tabnet: true          # TabNet
    node: true            # Neural Oblivious Decision Ensembles
    grownet: true         # GrowNet
    dcn2: true            # Deep & Cross Network v2
    tabm: true            # TabM
    
    # 5. Specialized & Advanced Architectures
    tangos: true          # TANGOS
    modernNCA: true       # ModernNCA
    bishop: true          # BISHOP
    tabautopnpnet: false  # TabAuto-PNPNet
    dnnr: true            # DNNR (Deep Neural Network Regression - specialized for regression)
    limix: false          # LiMiX