# ============================================================
# CONFIG_EXPERIMENT.yaml
# ============================================================
# This configuration file defines training and optimization settings
# that apply to all methods in the benchmark.
# ============================================================

# ------------------------------------------------------------
# Training and optimization settings
# ------------------------------------------------------------
max_epochs: 10              # Maximum number of epochs for deep models
batch_size: 256             # Batch size for training (ignored by classical models)
n_trials: 1                 # Number of hyperparameter tuning trials
early_stopping: true        # Whether to use early stopping during training
early_stopping_patience: 5  # Patience epochs for early stopping