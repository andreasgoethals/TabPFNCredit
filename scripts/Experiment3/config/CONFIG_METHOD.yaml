# ============================================================
# CONFIG_METHOD.yaml -- EXPERIMENT 3 (class-imbalance sweep)
# ============================================================
# Per your request this experiment is narrowed to the same five methods
# as Experiment 2:
#   - tabpfn_v3 / tabicl_v2 -- newest foundation models
