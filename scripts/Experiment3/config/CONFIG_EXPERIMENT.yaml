# =============================================================================
# CONFIG_EXPERIMENT.yaml -- EXPERIMENT 3: CLASS IMBALANCE ANALYSIS
# =============================================================================
# Purpose: how robust are the best methods to severe class imbalance?
# Constraint: no HPO. PD task only (LGD is regression).
# Methods enabled (in CONFIG_METHOD.yaml): tabpfn_v3, tabicl_v2, xgboost, catboost, LogReg.
# =============================================================================

# -----------------------------------------------------------------------------
# Standard training knobs
# -----------------------------------------------------------------------------
max_epochs: 50
batch_size: 255
n_trials: 1                       # NO HPO
early_stopping: true
early_stopping_patience: 10

# Model-seed repeats per fold. TALENT's own packaged defaults set this to 15,
# which refits every model 15x per fold -- but only ONE of those fits is ever
# reported (TALENT's RunResult carries the LAST seed's predictions, and that is
# what this repo reads), so seeds 0..13 are pure waste: 15x the GPU hours for a
# number that is thrown away. 1 = fit once per fold. Cross-method comparability
# comes from the fixed *split* seed above, not from the model seed. Set this to
# 15 only if you deliberately want TALENT's historical repeat count back.
seed_num: 1

# -----------------------------------------------------------------------------
# Imbalance sweep
# -----------------------------------------------------------------------------
# At each step we randomly DELETE minority-class rows (the majority class is
# kept in full) until the minority proportion hits the target. The sweep walks
# DOWN from `max` to `min` in increments of `step`.
# Defaults (per your request): 0.15 -> 0.0025 in steps of 0.0005
# (= 296 points per dataset, per method).
#
# NESTED / CUMULATIVE removal -- the removal uses a single fixed-seed
# permutation of the minority indices and keeps a PREFIX of it, so a lower
# target's surviving minority rows are a strict SUBSET of any higher target's.
# Going 0.15 -> 0.1495 only ever *deletes more* of the same minority rows; it
# never re-draws a fresh random subset, so the performance trend is due purely
# to fewer minority cases (not lucky/unlucky draws).
#
# The whole dataset (train, val AND test) is subsampled to the target rate, so
# every metric is measured on the subsampled distribution.
# -----------------------------------------------------------------------------
minority_proportion_max: 0.15
minority_proportion_min: 0.0025
minority_proportion_step: 0.0005
