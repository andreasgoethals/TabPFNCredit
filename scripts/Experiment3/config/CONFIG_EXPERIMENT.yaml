# =============================================================================
# CONFIG_EXPERIMENT.yaml -- EXPERIMENT 3: CLASS IMBALANCE ANALYSIS
# =============================================================================
# Purpose: how robust are the best methods to severe class imbalance?
# Constraint: no HPO. PD task only (LGD is regression).
# Methods enabled (in CONFIG_METHOD.yaml): tabpfn_v3, tabicl_v2, xgboost, LogReg.
# =============================================================================

# -----------------------------------------------------------------------------
# Standard training knobs
# -----------------------------------------------------------------------------
max_epochs: 50
batch_size: 255
n_trials: 1                       # NO HPO
early_stopping: true
early_stopping_patience: 10

# -----------------------------------------------------------------------------
# Imbalance sweep
# -----------------------------------------------------------------------------
# We undersample the majority class until the minority proportion hits the
# target. The sweep walks DOWN from `max` to `min` in increments of `step`.
# Defaults (per your request): 0.15 -> 0.0025 in steps of 0.0005
# (= 295 points per dataset, per method).
# -----------------------------------------------------------------------------
minority_proportion_max: 0.15
minority_proportion_min: 0.0025
minority_proportion_step: 0.0005
