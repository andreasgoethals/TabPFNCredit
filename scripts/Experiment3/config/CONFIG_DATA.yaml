# ============================================================
# CONFIG_DATA.yaml - EXPERIMENT 3: CLASS IMBALANCE ANALYSIS
# ============================================================
# This configuration file defines:
#   1. How datasets are split into train/validation/test sets
#   2. Where the PD and LGD data folders are located (relative paths)
#   3. Which Probability of Default (PD) datasets should be included
#
# NOTE:
# - All paths are relative to the repository root.
# - Toggle datasets on/off with `true` or `false`.
# - Experiment 3 focuses on CLASS IMBALANCE, so only PD (classification)
#   datasets are relevant. LGD datasets are excluded.
# ============================================================

# ------------------------------------------------------------
# Split configuration
# ------------------------------------------------------------
split:
  test_size: 0.2      # Fraction of full data reserved for testing, only used if CV splits = 1
  val_size: 0.2       # Fraction of train data used for validation
  cv_splits: 5        # Number of cross-validation folds (1 = no CV)
  seed: 42            # Random seed for reproducibility
  row_limit: Null     # Max number of rows to load from each dataset (null = all rows)
#                       This is the total number of rows before any test/train or cv split.

# ------------------------------------------------------------
# Folder paths
# ------------------------------------------------------------
paths:
  # The following paths should point to the folders containing
  # the raw PD and LGD datasets.
  pd_dir: "data/raw/pd"
  lgd_dir: "data/raw/lgd"

# ------------------------------------------------------------
# Probability of Default (PD) datasets
# ------------------------------------------------------------
# NOTE: Experiment 3 (Class Imbalance Analysis) only applies to
# classification tasks. LGD (regression) datasets are not used.
# ------------------------------------------------------------
dataset_pd:
  # Enable or disable datasets here.
  0001.gmsc: false               # Give Me Some Credit dataset
  0002.taiwan_creditcard: true  # Taiwan Credit Card dataset
  0003.vehicle_loan: true
  0004.lendingclub: false
  0005.case_study: false
  0006.myhom: false
  0007.hackerearth: true
  0008.cobranded: true
  0009.german: false
  0010.bank_status: true
  0011.thomas: false
  0012.loan_default: true
  0013.home_credit: true
  0014.hmeq: false
  0015.algorithmwatch: true

# ------------------------------------------------------------
# Loss Given Default (LGD) datasets
# ------------------------------------------------------------
# NOTE: LGD datasets are DISABLED for Experiment 3 because
# class imbalance analysis only applies to classification tasks.
# ------------------------------------------------------------
dataset_lgd:
  # These datasets are disabled for Experiment 3
  0001.heloc: false
  0002.loss2: false
  0003.axa: false
  0004.base_model: false
  0005.base_modelisation: false
  0006.lgd_freddie: false
  0007.lgd_lendingclub: false
