# ============================================================
# CONFIG_DATA.yaml -- EXPERIMENT 3: CLASS-IMBALANCE SWEEP (PD only)
# ============================================================
# Experiment 3 sweeps the minority-class proportion from
# `minority_proportion_max` down to `minority_proportion_min` in
# `minority_proportion_step` decrements. Only classification (PD) is
# relevant -- LGD targets are continuous, so the LGD block is empty
# by design.
#
# Selection rule -- TWO filters, both must pass
# --------------
# A PD dataset takes part in Experiment 3 only if BOTH hold:
#
#   1. Row count    >= min_rows         (set below; default 30,000).
#   2. Minority rate >  minority_proportion_max  (set in
#      CONFIG_EXPERIMENT.yaml; default 0.15).
#
# Filter 2 is automatic and NOT configured here: the sweep subsamples the
# minority class DOWN from minority_proportion_max, so a dataset whose
# natural minority rate is already below that ceiling can never reach the
# top of the sweep and is dropped automatically (with an INFO log).
#
# (``min_rows`` is the inclusive lower bound: ``30000`` means ">= 30,000".)
# The high row cutoff is intentional: at minority_proportion 0.0025, even
# 30,000 rows yields only ~75 positive examples per fold, already on the
# edge of what is statistically meaningful.
# ============================================================

# ------------------------------------------------------------
# Split configuration
# ------------------------------------------------------------
split:
  test_size: 0.2      # Only used if cv_splits == 1
  val_size: 0.2       # Fraction of train data used for validation
  cv_splits: 5        # Number of cross-validation folds (1 = no CV)
  seed: 42            # Random seed for reproducibility
  row_limit: null     # Full dataset before the minority sweep filters it.

# ------------------------------------------------------------
# Folder paths
# ------------------------------------------------------------
paths:
  pd_dir: "data/raw/pd"
  lgd_dir: "data/raw/lgd"

# ------------------------------------------------------------
# Probability of Default (PD) datasets -- min-rows filter
# ------------------------------------------------------------
dataset_pd:
  min_rows: 30000

# ------------------------------------------------------------
# Loss Given Default (LGD) datasets -- not used in Experiment 3
# ------------------------------------------------------------
dataset_lgd: {}
