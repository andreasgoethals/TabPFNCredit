# =============================================================================
# CONFIG_EXPERIMENT.yaml - EXPERIMENT 2: LEARNING CURVE ANALYSIS
# =============================================================================
# Purpose: how do the best methods' metrics scale with training-set size?
# Constraint: no HPO (defaults only).
# Methods enabled (in CONFIG_METHOD.yaml): tabpfn_v3, tabicl_v2, xgboost,
#                                          catboost, LogReg (PD) / LinearRegression (LGD).
# =============================================================================

# -----------------------------------------------------------------------------
# Standard training knobs
# -----------------------------------------------------------------------------
max_epochs: 50
batch_size: 255
n_trials: 1                       # NO HPO
early_stopping: true
early_stopping_patience: 10

# Model-seed repeats per fold. TALENT's own packaged defaults set this to 15,
# which refits every model 15x per fold -- but only ONE of those fits is ever
# reported (TALENT's RunResult carries the LAST seed's predictions, and that is
# what this repo reads), so seeds 0..13 are pure waste: 15x the GPU hours for a
# number that is thrown away. 1 = fit once per fold. Cross-method comparability
# comes from the fixed *split* seed above, not from the model seed. Set this to
# 15 only if you deliberately want TALENT's historical repeat count back.
seed_num: 1

# -----------------------------------------------------------------------------
# Learning-curve sweep -- configurable PER TASK
# -----------------------------------------------------------------------------
# For each task we walk row_limit DOWN from row_max to row_min in steps of
# row_step. DataFeeder caps the full dataset to row_limit BEFORE splitting,
# so the train portion is row_limit * (1 - test_size - val_size).
#
# row_max does DOUBLE DUTY -- it is BOTH:
#   1. the top of the training-size sweep, AND
#   2. the dataset-inclusion threshold: every dataset with >= row_max rows
#      is included automatically (a smaller dataset could never reach the
#      top of the sweep). This is the ONLY place the dataset set is chosen
#      for Experiment 2 -- CONFIG_DATA.yaml's dataset blocks are empty.
#
# So to change which datasets take part, just change row_max here.
#
# Defaults:
#   PD  -- sweep 30 000 ->   100 (step 25); datasets with >= 30 000 rows.
#   LGD -- sweep  4 600 ->   100 (step 10); datasets with >=  4 600 rows.
# The steps are deliberately small for fine-grained learning curves; each point
# is saved as its own results file and skip-if-done makes the sweep resumable,
# so a slot that hits the wall-clock cap simply continues on the next submit.
# -----------------------------------------------------------------------------
learning_curve:
  pd:
    row_max: 30000
    row_min: 100
    row_step: 25
  lgd:
    row_max: 4600
    row_min: 100
    row_step: 10
