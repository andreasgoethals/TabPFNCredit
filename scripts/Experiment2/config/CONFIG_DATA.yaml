# ============================================================
# CONFIG_DATA.yaml -- EXPERIMENT 2: LEARNING-CURVE SWEEP
# ============================================================
# Experiment 2 sweeps the training-set size (`row_limit`) for a small
# set of methods. To keep the sweep meaningful we restrict to the
# larger datasets only -- datasets too small for a learning curve are
# automatically excluded.
#
# Selection rule
# --------------
# Instead of toggling each dataset by hand, this experiment selects
# datasets by *minimum row count*:
#
#   * PD  : every dataset with >= 30,000 rows
#   * LGD : every dataset with >= 4,600 rows
#
# (Read: ``min_rows`` is the *inclusive* lower bound. Writing
# ``min_rows: 30000`` means "30,000 rows or more".)
#
# To switch back to per-dataset toggles, replace ``min_rows`` with a
# regular ``{dataset_name: true/false}`` dict (see Experiment 0 / 1
# configs for the toggle format).
# ============================================================

# ------------------------------------------------------------
# Split configuration
# ------------------------------------------------------------
split:
  test_size: 0.2      # Only used if cv_splits == 1
  val_size: 0.2       # Fraction of train data used for validation
  cv_splits: 5        # Number of cross-validation folds (1 = no CV)
  seed: 42            # Random seed for reproducibility
  row_limit: null     # The learning-curve sweep overrides this per point.

# ------------------------------------------------------------
# Folder paths
# ------------------------------------------------------------
paths:
  pd_dir: "data/raw/pd"
  lgd_dir: "data/raw/lgd"

# ------------------------------------------------------------
# Probability of Default (PD) datasets -- min-rows filter
# ------------------------------------------------------------
dataset_pd:
  min_rows: 30000

# ------------------------------------------------------------
# Loss Given Default (LGD) datasets -- min-rows filter
# ------------------------------------------------------------
dataset_lgd:
  min_rows: 4600
